<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f54">
<title>Inventario de casa</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --verde:#1f6f54; --verde-osc:#175641; --fondo:#eef2ee; --mio:#d6f0e2; --bot:#ffffff; --texto:#1b2420; --gris:#66736c; --linea:#d9e0da; --rojo:#b3402f; --rojo-f:#fbe9e5; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto); background: #cfd8d2; }
  #app { height: 100%; height: 100dvh; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; background: var(--fondo); }
  header { background: var(--verde); color: #fff; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 20px; margin: 0; flex: 1; font-weight: 600; }
  header button { background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 18px; padding: 7px 12px; font-size: 14px; }
  #aviso { background: #fff6d8; color: #5c4a00; font-size: 14px; padding: 7px 16px; border-bottom: 1px solid #ecdf9f; }
  main { flex: 1; min-height: 0; position: relative; }
  .vista { position: absolute; inset: 0; display: none; flex-direction: column; }
  .vista.activa { display: flex; }

  #mensajes { flex: 1; overflow-y: auto; padding: 14px 12px 6px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 86%; padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px 1px rgba(0,0,0,.07); }
  .msg.yo { align-self: flex-end; background: var(--mio); border-bottom-right-radius: 5px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 5px; }
  .msg.err { background: var(--rojo-f); color: #7d2a1d; }
  .msg small { display: block; color: var(--gris); font-size: 12px; margin-top: 3px; text-align: right; }
  .msg .ops { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
  .msg .ops button { flex: 1; border: 0; border-radius: 12px; padding: 11px 10px; font-size: 16px; font-weight: 600; background: var(--verde); color: #fff; }
  .msg .ops button.sec { background: #e6ece7; color: var(--texto); }
  .msg .ops.col { flex-direction: column; }
  .msg .ops.col button { flex: none; width: 100%; }
  .msg .ops button:disabled { opacity: .45; }
  .msg .ops input[type=date] { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--linea); border-radius: 12px; background: #fff; color: var(--texto); min-height: 46px; }
  #atajos { display: flex; gap: 8px; padding: 6px 12px; overflow-x: auto; scrollbar-width: none; }
  #atajos::-webkit-scrollbar { display: none; }
  #atajos button { flex: none; border: 1px solid var(--linea); background: #fff; color: var(--verde-osc); border-radius: 18px; padding: 8px 14px; font-size: 15px; }
  #barra { display: flex; gap: 8px; padding: 8px 12px 10px; }
  #texto { flex: 1; min-width: 0; font: inherit; padding: 12px 16px; border: 1px solid var(--linea); border-radius: 24px; background: #fff; outline: none; }
  #texto:focus { border-color: var(--verde); }
  #enviar { flex: none; width: 50px; height: 50px; border-radius: 50%; border: 0; background: var(--verde); color: #fff; font-size: 22px; }
  #enviar:disabled { opacity: .5; }

  #inv-top { padding: 12px 12px 8px; display: flex; gap: 8px; }
  #buscar { flex: 1; min-width: 0; font: inherit; padding: 11px 14px; border: 1px solid var(--linea); border-radius: 12px; background: #fff; outline: none; }
  #inv-top button { border: 1px solid var(--linea); background: #fff; border-radius: 12px; padding: 0 14px; font-size: 15px; color: var(--verde-osc); }
  #resumen { padding: 0 16px 6px; color: var(--gris); font-size: 14px; }
  #lista { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
  .fila { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 7px; display: flex; align-items: center; gap: 10px; }
  .fila .n { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
  .fila .n span { display: block; font-weight: 400; font-size: 13px; color: var(--gris); }
  .fila .n span.lote b { font-weight: 600; margin-left: 6px; padding: 1px 7px; border-radius: 9px; font-size: 12px; }
  .fila .n span.lote b.mal { background: var(--rojo-f); color: var(--rojo); }
  .fila .n span.lote b.pronto { background: #fff1cf; color: #7a5200; }
  .fila .n b.tag { display: inline-block; vertical-align: middle; margin-left: 8px; padding: 1px 8px; border-radius: 9px; font-size: 12px; font-weight: 600; background: #fff1cf; color: #7a5200; }
  .fila .c { text-align: right; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fila .c span { font-size: 14px; font-weight: 400; color: var(--gris); margin-left: 4px; }
  .fila.cero { background: var(--rojo-f); }
  .fila.cero .c { color: var(--rojo); font-size: 15px; }
  #vacio { text-align: center; color: var(--gris); padding: 40px 24px; }
  #planilla { display: none; margin: 0 12px 10px; text-align: center; padding: 12px; border-radius: 12px; background: #fff; border: 1px solid var(--linea); color: var(--verde-osc); font-weight: 600; text-decoration: none; }

  nav { display: flex; background: #fff; border-top: 1px solid var(--linea); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: 0; background: none; padding: 12px 0 11px; font-size: 16px; color: var(--gris); border-top: 3px solid transparent; }
  nav button.activa { color: var(--verde); font-weight: 700; border-top-color: var(--verde); }

  .fila { cursor: pointer; }
  .fila:active { background: #e3ece6; }
  .fila .ch { color: #a9b5ad; font-size: 24px; line-height: 1; margin-left: -2px; }
  #pista { padding: 0 16px 8px; color: var(--gris); font-size: 14px; }
  #hoja { position: fixed; inset: 0; background: rgba(20,35,28,.55); display: none; align-items: flex-end; justify-content: center; z-index: 4; }
  #hoja .caja { background: #fff; width: 100%; max-width: 640px; border-radius: 20px 20px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); max-height: 88dvh; overflow-y: auto; }
  #hoja .cab { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  #hoja h2 { flex: 1; margin: 0; font-size: 22px; overflow-wrap: anywhere; }
  #hoja-x { border: 0; background: var(--fondo); width: 38px; height: 38px; border-radius: 50%; font-size: 17px; color: var(--gris); flex: none; }
  #hoja-cuerpo { display: flex; flex-direction: column; gap: 10px; }
  #hoja p { margin: 0; }
  #hoja .preg { font-size: 19px; font-weight: 600; }
  #hoja .det { color: var(--gris); white-space: pre-wrap; }
  #hoja .det:empty, #hoja .preg:empty { display: none; }
  #hoja .res { white-space: pre-wrap; background: var(--mio); border-radius: 12px; padding: 12px 14px; }
  #hoja .res.err { background: var(--rojo-f); color: #7d2a1d; }
  #hoja button.pri, #hoja button.sec, #hoja button.ret { border: 0; border-radius: 14px; padding: 15px 12px; font-size: 18px; font-weight: 600; width: 100%; }
  #hoja button.pri { background: var(--verde); color: #fff; }
  #hoja button.sec { background: #e6ece7; color: var(--texto); }
  #hoja button.chico { font-size: 16px; padding: 12px; font-weight: 500; }
  #hoja button.ret { background: #f3ddd8; color: #7d2a1d; }
  #hoja button:disabled { opacity: .4; }
  #hoja .dos { display: flex; gap: 10px; }
  #hoja .cant { display: flex; align-items: center; gap: 10px; }
  #hoja .cant button { flex: none; width: 58px; height: 58px; border-radius: 50%; border: 0; background: #e6ece7; font-size: 30px; line-height: 1; color: var(--texto); }
  #hoja .cant input { flex: 1; min-width: 0; font: inherit; font-size: 30px; font-weight: 700; text-align: center; padding: 8px; border: 1px solid var(--linea); border-radius: 14px; }
  #hoja .cant span { color: var(--gris); min-width: 3.2em; }
  #hoja input[type=date] { font: inherit; font-size: 18px; width: 100%; padding: 12px; border: 1px solid var(--linea); border-radius: 14px; background: #fff; color: var(--texto); min-height: 52px; }
  #quien { position: fixed; inset: 0; background: rgba(20,35,28,.55); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 5; }
  #quien .caja { background: #fff; border-radius: 18px; padding: 22px; width: 100%; max-width: 380px; }
  #quien h2 { margin: 0 0 4px; font-size: 21px; }
  #quien p { margin: 0 0 14px; color: var(--gris); }
  #quien .nombres { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  #quien .nombres button { flex: 1; border: 1px solid var(--linea); background: var(--fondo); border-radius: 12px; padding: 13px 8px; font-size: 17px; }
  #quien input { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--linea); border-radius: 12px; margin-bottom: 10px; }
  #quien .ok { width: 100%; border: 0; border-radius: 12px; padding: 13px; background: var(--verde); color: #fff; font-size: 17px; font-weight: 600; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Inventario de casa</h1>
    <button id="btn-quien" type="button"></button>
  </header>
  <div id="aviso" hidden></div>
  <main>
    <section class="vista activa" id="v-chat">
      <div id="mensajes" aria-live="polite"></div>
      <div id="atajos">
        <button type="button" data-t="Compré ">Compré…</button>
        <button type="button" data-t="Saqué ">Saqué…</button>
        <button type="button" data-t="¿Cuánto hay de ">¿Cuánto hay de…?</button>
        <button type="button" data-e="¿Qué vence?">¿Qué vence?</button>
        <button type="button" data-e="¿Qué falta?">¿Qué falta?</button>
        <button type="button" data-e="Deshacer">Deshacer</button>
        <button type="button" data-e="Ayuda">Ayuda</button>
      </div>
      <form id="barra" autocomplete="off">
        <input id="texto" type="text" placeholder="Ej: compré 2 kg de arroz" enterkeyhint="send" autocapitalize="sentences">
        <button id="enviar" type="submit" aria-label="Enviar">➤</button>
      </form>
    </section>
    <section class="vista" id="v-inv">
      <div id="inv-top">
        <input id="buscar" type="search" placeholder="Buscar producto">
        <button id="refrescar" type="button">Actualizar</button>
      </div>
      <div id="resumen"></div>
      <div id="pista">Tocá un producto para agregar o retirar.</div>
      <div id="lista"></div>
      <a id="planilla" target="_blank" rel="noopener">Abrir la planilla de Google</a>
    </section>
  </main>
  <nav>
    <button type="button" class="activa" data-v="v-chat">Chat</button>
    <button type="button" data-v="v-inv">Inventario</button>
  </nav>
</div>

<div id="hoja">
  <div class="caja" role="dialog" aria-labelledby="hoja-titulo">
    <div class="cab"><h2 id="hoja-titulo"></h2><button id="hoja-x" type="button" aria-label="Cerrar">✕</button></div>
    <div id="hoja-cuerpo"></div>
  </div>
</div>

<div id="quien">
  <div class="caja">
    <h2>¿Quién sos?</h2>
    <p>Así queda anotado quién hizo cada cambio.</p>
    <div class="nombres">
      <button type="button">Mamá</button><button type="button">Papá</button><button type="button">Fede</button>
    </div>
    <input id="otro-nombre" type="text" placeholder="Otro nombre" maxlength="20">
    <button class="ok" type="button">Listo</button>
  </div>
</div>

<script src="config.js"></script>
<script src="core.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function leer(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
  function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  /* La dirección de la planilla no va publicada con la app: llega una sola vez en el
     link de instalación (…/#c=CODIGO) y queda guardada en el teléfono. */
  var mc = /[#&]c=([\w-]{20,})/.exec(location.hash);
  if (mc) {
    guardar('inv.api', 'https://script.google.com/macros/s/' + mc[1] + '/exec');
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  var API = (window.INVENTARIO_API_URL || '').trim() || leer('inv.api', '');

  var quien = leer('inv.quien', '');
  var chat = leer('inv.chat', []);
  var inv = leer('inv.cache', []);
  var cfg = leer('inv.cfg', []);      // ajustes por producto: mínimo para avisar y "nunca vence"
  var planilla = leer('inv.planilla', '');
  var ocupado = false;

  /* ----- conexión: Google Sheets, o modo de prueba guardando en este dispositivo ----- */
  function api(req) {
    if (!API) {
      var est = leer('inv.local', { inv: [], ultimos: [] });
      est.cfg = est.cfg || [];
      est.ahora = new Date().toISOString(); est.hoy = Core.hoyLocal();
      var r = Core.procesar(est, req);
      if (r.movs.length) est.ultimos = r.movs;
      r.resp.cfg = est.cfg;
      guardar('inv.local', { inv: est.inv, ultimos: est.ultimos, cfg: est.cfg });
      return Promise.resolve(JSON.parse(JSON.stringify(r.resp)));
    }
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { if (!d || !d.ok) throw new Error((d && d.error) || 'respuesta inválida'); return d; });
  }
  function recibir(d) {
    if (d.cfg) { cfg = d.cfg; guardar('inv.cfg', cfg); }
    if (d.inv) { inv = d.inv; guardar('inv.cache', inv); }
    if (d.inv || d.cfg) pintarInv();
    if (d.planilla) { planilla = d.planilla; guardar('inv.planilla', planilla); pintarInv(); }
    return d;
  }

  /* ----- chat ----- */
  function hora(ts) { var d = new Date(ts); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function pintarMsg(m) {
    var el = document.createElement('div');
    el.className = 'msg ' + (m.de === 'yo' ? 'yo' : 'bot') + (m.err ? ' err' : '');
    el.textContent = m.t;
    if (m.ops) {
      var ops = document.createElement('div'); ops.className = 'ops';
      m.ops.forEach(function (o, i) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = o.t; if (i) b.className = 'sec';
        b.onclick = function () { ops.remove(); o.f(); };
        ops.appendChild(b);
      });
      el.appendChild(ops);
    }
    if (m.ui) { var cont = document.createElement('div'); m.ui(cont); el.appendChild(cont); }
    var s = document.createElement('small'); s.textContent = hora(m.ts); el.appendChild(s);
    $('mensajes').appendChild(el);
    $('mensajes').scrollTop = $('mensajes').scrollHeight;
  }
  function decir(de, t, extra) {
    var m = { de: de, t: t, ts: Date.now() };
    if (extra && extra.err) m.err = 1;
    chat.push(m); if (chat.length > 200) chat = chat.slice(-200);
    guardar('inv.chat', chat);
    if (extra && (extra.ops || extra.ui)) m = { de: de, t: t, ts: m.ts, ops: extra.ops, ui: extra.ui };
    pintarMsg(m);
  }
  function bot(t, extra) { decir('bot', t, extra); }

  var AYUDA = 'Escribime como en un chat. Por ejemplo:\n\n' +
    '• Compré 2 kg de arroz y 3 latas de atún\n• Compré 2 puré de tomate que vencen 15/03/2027\n• Saqué 1 leche\n• Se terminó el aceite\n• Hay 12 huevos  (para corregir la cantidad)\n' +
    '• ¿Cuánto arroz hay?\n• ¿Qué vence?\n• ¿Qué falta?  (lo que se terminó y lo que queda poco)\n• Mínimo de azúcar 10 kg  (para que avise cuando quede poco)\n• La sal nunca vence  (no pregunta más la fecha)\n• Deshacer  (si te equivocaste)\n• Borrar arroz  (lo quita de la lista)\n\n' +
    'También podés ir a la pestaña Inventario y tocar un producto para agregar o retirar sin escribir.\n\n' +
    'Cuando agregás algo te pregunto si tiene fecha de vencimiento. Cuando sacás algo que tiene varias fechas, te pregunto cuál sacaste y te aviso si queda otro que vence antes.\n\nEn la pestaña Inventario ves todo lo que hay.';

  var cola = [], pend = null;   // productos del mensaje que esperan una respuesta (vencimiento / cuál lote)

  function boton(t, sec) { var b = document.createElement('button'); b.type = 'button'; b.textContent = t; if (sec) b.className = 'sec'; return b; }

  function mandar(req) {
    ocupado = true; $('enviar').disabled = true;
    return api(req).then(recibir).then(function (d) {
      (d.res || []).forEach(function (r) { bot(r.msg, { err: !r.ok }); });
      return d;
    }).catch(function () { return null; }).then(function (d) { ocupado = false; $('enviar').disabled = false; return d; });
  }
  function falla(reintentar) {
    bot('No pude guardar el cambio. Revisá la conexión a internet y probá de nuevo.', { err: true, ops: [{ t: 'Reintentar', f: reintentar }] });
  }

  function encolar(items, texto) {
    var id = Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    ocupado = true;
    return api({ a: 'inv' }).then(recibir).catch(function () {}).then(function () {
      ocupado = false;
      items.forEach(function (it) { delete it.implicita; cola.push({ it: it, texto: texto, id: id }); });
      seguir();
    });
  }
  function seguir() {
    pend = null;
    var x = cola[0];
    if (!x) return;
    var p = Core.preparar(inv, x.it, cfg);
    if (p.pregunta === 'cual' || p.pregunta === 'parecido') return preguntarProducto(x, p);
    if (p.pregunta === 'venc') return preguntarVenc(x);
    if (p.pregunta === 'lote') return preguntarLote(x, p);
    enviarItem(x);
  }
  /* Si después del cambio el producto quedó en su mínimo o por debajo, lo avisa. */
  function avisoPoco(nombre) {
    var p = Core.buscar(inv, nombre).p, c = p && Core.cfgDe(cfg, p.producto);
    if (!p || p.total === 0 || !c || !(c.min > 0) || p.total > c.min) return '';
    return 'Queda poco de ' + p.producto + ': ' + Core.cantTxt(p.total, p.unidad) + ' (aviso en ' + Core.cantTxt(c.min, p.unidad) + '). Ya está en la lista de compras.';
  }
  function enviarItem(x) {
    if (cola[0] !== x || ocupado) return;
    var it = x.it;
    var req = it.tipo === 'cfg' ? { a: 'cfg', quien: quien, producto: it.producto, min: it.min, unidad: it.unidad, nv: it.nv }
      : { a: 'mov', quien: quien, texto: x.texto, items: [it], id: x.id };
    mandar(req).then(function (d) {
      if (!d) return falla(function () { enviarItem(x); });
      var bien = d.res && d.res[0] && d.res[0].ok, sigue = function () { cola.shift(); seguir(); };
      if (bien && (it.tipo === 'salida' || it.tipo === 'ajuste')) { var a = avisoPoco(it.producto); if (a) bot(a); }
      if (bien && x.nunca) return mandar({ a: 'cfg', quien: quien, producto: it.producto, nv: true }).then(sigue);
      sigue();
    });
  }
  function responder(venc, eco) {
    var x = cola[0];
    if (!x || !pend) return;
    if (pend.el) pend.el.remove();
    pend = null;
    decir('yo', eco);
    x.it.venc = venc;
    enviarItem(x);
  }

  /* Varios productos coinciden, o el nombre se parece a uno que ya existe. */
  function elegirProducto(nombre, eco) {
    var x = cola[0];
    if (!x || !pend) return;
    if (pend.el) pend.el.remove();
    pend = null;
    decir('yo', eco);
    if (nombre) x.it.producto = nombre; else x.it.nuevo = true;
    seguir();
  }
  function preguntarProducto(x, p) {
    var cual = p.pregunta === 'cual', ps = Core.productos(inv);
    pend = { tipo: 'prod', opciones: p.opciones, nuevo: p.nuevo };
    var txt = cual ? 'Hay varios productos que coinciden con "' + x.it.producto + '". ¿Cuál es?'
      : '"' + x.it.producto + '" no está anotado así. ¿Quisiste decir ' + p.opciones.join(' o ') + '?';
    bot(txt, { ui: function (c) {
      pend.el = c; c.className = 'ops col';
      p.opciones.forEach(function (n) {
        var g = ps.filter(function (q) { return q.producto === n; })[0];
        var b = boton((cual ? '' : 'Sí, ') + n + (cual && g ? ' · hay ' + Core.cant(g.total, g.unidad) : ''));
        b.onclick = function () { elegirProducto(n, n); };
        c.appendChild(b);
      });
      var no = boton(p.nuevo ? (cual ? 'Ninguno: es un producto nuevo' : 'No, es un producto nuevo') : (cual ? 'Ninguno de esos' : 'No, es otra cosa'), true);
      no.onclick = function () { elegirProducto(null, no.textContent); };
      c.appendChild(no);
    } });
  }

  function preguntarVenc(x) {
    pend = { tipo: 'venc' };
    bot('¿' + x.it.producto + ' tiene fecha de vencimiento?\nElegila acá abajo o escribila (por ejemplo 15/03/2027).', { ui: function (c) {
      pend.el = c; c.className = 'ops col';

    if (pend.tipo === 'prod') {
      var ops = pend.opciones, k = n.replace(/^(si\s+)?((el|la|los|las)\s+)?(de\s+)?/, '').trim();
      if (/^(si|sip|ese|esa|eso|exacto|correcto)$/.test(n) && ops.length === 1) return elegirProducto(ops[0], t);
      if (/^(no|ninguno|ninguna|nuevo|es nuevo|otro|otra)\b/.test(n)) return elegirProducto(null, t);
      var m = k ? ops.filter(function (o) { return Core.sinAcentos(o.toLowerCase()).indexOf(k) >= 0; }) : [];
      if (m.length === 1) return elegirProducto(m[0], t);

  function refrescar() { return api({ a: 'inv' }).then(recibir).catch(function () {}); }
  $('buscar').addEventListener('input', pintarInv);
  $('refrescar').addEventListener('click', function () { var b = this; b.disabled = true; refrescar().then(function () { b.disabled = false; }); });

  document.querySelector('nav').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    document.querySelectorAll('nav button').forEach(function (x) { x.classList.toggle('activa', x === b); });
    document.querySelectorAll('.vista').forEach(function (x) { x.classList.toggle('activa', x.id === b.dataset.v); });
    if (b.dataset.v === 'v-inv') refrescar(); else $('mensajes').scrollTop = $('mensajes').scrollHeight;
  });

  /* ----- quién sos ----- */
  function pedirQuien() { $('quien').style.display = 'flex'; $('otro-nombre').value = ''; }
  function fijarQuien(n) {
    n = String(n || '').trim(); if (!n) return;
    quien = n; guardar('inv.quien', quien);
    $('btn-quien').textContent = quien; $('quien').style.display = 'none';
    if (!chat.length) bot('¡Hola, ' + quien + '! Contame qué compraste o qué sacaste y yo lo anoto.\n\nPor ejemplo: "compré 2 kg de arroz y 3 latas de atún" o "saqué 1 leche".');
  }
  $('quien').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    fijarQuien(b.classList.contains('ok') ? $('otro-nombre').value : b.textContent);
  });
  $('btn-quien').addEventListener('click', pedirQuien);

  /* ----- inicio ----- */
  if (!API) {
    $('aviso').hidden = false;
    $('aviso').textContent = location.protocol === 'https:' ? 'Falta conectar con la planilla: abrí el link de instalación que te pasaron. Mientras tanto, lo que anotes queda solo en este teléfono.'
      : 'Modo de prueba: los datos se guardan solo en este dispositivo.';
  }
  chat.forEach(pintarMsg);
  pintarInv();
  if (quien) $('btn-quien').textContent = quien; else pedirQuien();
  refrescar();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refrescar(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
